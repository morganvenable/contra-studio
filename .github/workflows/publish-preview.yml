name: Publish previewed build

on:
  workflow_dispatch:
    inputs:
      artifact_commit:
        description: Exact pages-release commit containing the previewed static build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.artifact_commit }}
          path: site
      - name: Check static entry and retain deployed revision
        env:
          ARTIFACT_COMMIT: ${{ inputs.artifact_commit }}
        run: |
          [[ "$ARTIFACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C site rev-parse HEAD)" = "$ARTIFACT_COMMIT"
          test -f site/index.html
          test -d site/assets
          test -f site/contradb-index.json
          test -s site/LICENSE
          test -s site/THIRD_PARTY_NOTICES.md
          test -s site/THREE-LICENSE
          rm -rf site/.git
          printf '%s\n' "$ARTIFACT_COMMIT" > site/deployed-commit.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
